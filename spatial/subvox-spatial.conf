# Binaural renderer for subvox spatial: a stereo sink whose two channels are rendered as
# virtual loudspeakers at ±30° through an HRTF (libmysofa "sofa" spatializer), then sent
# to the earbuds. `python3 -m subvox spatial` moves the speakers' Azimuth/Elevation so they
# stay put in the room while the head turns.
#
# Install: tools/install-spatial.sh   (copies to ~/.config/pipewire/filter-chain.conf.d/
#          and restarts the user filter-chain service; the main PipeWire daemon is untouched)
#
# HRTF: TH Köln Neumann KU100, 2702-point Lebedev grid, 3.25 m (sofacoustics.org/data/database/thk/),
# downloaded by tools/install-spatial.sh into ~/.local/share/subvox/hrtf/. The MIT KEMAR set in
# /usr/share/libmysofa sounds thin by comparison. Radius must match the measurement distance.
# SOFA convention: azimuth counter-clockwise from the front, so +30 is front-left.
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Spatial (Powerbeats)"
            media.name       = "Spatial (Powerbeats)"
            filter.graph = {
                nodes = [
                    {
                        type   = sofa
                        label  = spatializer
                        name   = spFL
                        config = {
                            filename  = "@HRTF@"
                            blocksize = 256
                            tailsize  = 256
                        }
                        control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 3.25 }
                    }
                    {
                        type   = sofa
                        label  = spatializer
                        name   = spFR
                        config = {
                            filename  = "@HRTF@"
                            blocksize = 256
                            tailsize  = 256
                        }
                        control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 3.25 }
                    }
                    { type = builtin label = mixer name = mixL }
                    { type = builtin label = mixer name = mixR }
                ]
                links = [
                    { output = "spFL:Out L" input = "mixL:In 1" }
                    { output = "spFR:Out L" input = "mixL:In 2" }
                    { output = "spFL:Out R" input = "mixR:In 1" }
                    { output = "spFR:Out R" input = "mixR:In 2" }
                ]
                inputs  = [ "spFL:In" "spFR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            capture.props = {
                node.name      = "subvox_spatial"
                media.class    = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name         = "subvox_spatial.out"
                node.passive      = true
                # Only ever play to the buds. Without linger, WirePlumber destroys the node
                # (and the module unloads) the moment the buds drop; with it, it waits for them.
                node.dont-fallback = true
                node.linger       = true
                target.object     = "bluez_output.28:2D:7F:2D:03:24"
                stream.dont-remix = true
                audio.channels    = 2
                audio.position    = [ FL FR ]
            }
        }
    }
]
